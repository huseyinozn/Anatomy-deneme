<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro sticker kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,700;1,800;1,900&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #e6e7e9; font: 14px system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #ui { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  #ui button { padding: 8px 12px; border-radius: 8px; border: 1px solid #c8cbd0; background: #fff; }
</style>
</head><body>
<div id="stage"></div>
<div id="ui"></div>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
// Quadro sticker kit concepts. Every sticker is its own flat 2D artwork in millimetres, placed only on a face measured
// flat on the production CAD model, inside that face with a small margin. Outside the stickers every part keeps its
// own material: clear aluminium, white and black plastic. The same artwork is what the cut files will be made from.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const THEMES = { red: "#d7191f", yellow: "#ffc20e", blue: "#0a63c9", green: "#1fa64a" };
const INK = "#111214", WHITE = "#f4f4f1", SILVER = "#b9bec4", TECH = "#7d838a";
const PX = 12;                                        // canvas pixels per millimetre
// The family: block ends cut at 60 degrees, bands across narrow panels at 30, three bar weights, one gap.
const RAKE = Math.tan(Math.PI / 6);                   // block ends: horizontal run per unit height (60 degrees)
const SLOPE = Math.tan(Math.PI / 6);                  // bands: rise per unit run (30 degrees, rising to the right)
const GAP = 1.4;                                      // the aluminium gap between blocks, mm
const DISPLAY = "'Barlow Condensed', 'Arial Narrow', sans-serif";

// ---------- drawing helpers, all in mm, canvas y down ----------
// a raked block: from x0 to x1 along the bottom edge, leaning right by RAKE * height
function blade(g, x0, x1, y0, y1, color, lean = RAKE) {
  const h = y1 - y0; g.fillStyle = color; g.beginPath();
  g.moveTo(x0, y1); g.lineTo(x1, y1); g.lineTo(x1 + lean * h, y0); g.lineTo(x0 + lean * h, y0); g.closePath(); g.fill();
}
// three descending bars: widths 5, 3.2, 1.8 mm
function bars(g, x, y0, y1, color, scale = 1, lean = RAKE) {
  let at = x;
  for (const w of [5, 3.2, 1.8]) { blade(g, at, at + w * scale, y0, y1, color, lean); at += (w + 2.2) * scale; }
  return at;
}
// everything below a line that rises to the right, starting at height y (canvas y, at x = 0)
function below(g, W, H, y, color) { g.fillStyle = color; g.beginPath(); g.moveTo(-1, H + 1); g.lineTo(W + 1, H + 1); g.lineTo(W + 1, y - SLOPE * (W + 1)); g.lineTo(-1, y + SLOPE); g.closePath(); g.fill(); }
// a band across the panel, parallel to that line, t thick (vertically)
function band(g, W, y, t, color) { g.fillStyle = color; g.beginPath(); g.moveTo(-1, y + SLOPE); g.lineTo(W + 1, y - SLOPE * (W + 1)); g.lineTo(W + 1, y - t - SLOPE * (W + 1)); g.lineTo(-1, y - t + SLOPE); g.closePath(); g.fill(); }
function text(g, s, x, y, size, color, weight = 800, italic = true, spacing = 0, align = "left") {
  g.font = `${italic ? "italic " : ""}${weight} ${size}px ${DISPLAY}`; g.fillStyle = color; g.textAlign = align; g.textBaseline = "alphabetic";
  g.letterSpacing = spacing + "px"; g.fillText(s, x, y); return g.measureText(s).width;
}
let LOGO = null;                                      // the Co Print mark, recoloured per use
async function loadLogo() {
  const svg = await (await fetch("../logo.svg")).text();
  const make = (c) => new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.src = URL.createObjectURL(new Blob([svg.replace(/#[0-9a-fA-F]{6}/g, c)], { type: "image/svg+xml" })); });
  LOGO = { white: await make(WHITE), ink: await make(INK) };
}
function logo(g, x, y, h, which) { const im = LOGO[which]; g.drawImage(im, x, y, (h * im.width) / im.height, h); }

// ---------- the stickers (W x H in mm) ----------
const ART = {
  // X beam front plate, the hero: 720 x 31, left from the front is the start. About 95 mm at each end sit behind the
  // Qdock covers, so the composition lives between 100 and 640: a heavy black start, the colour blade carrying QUADRO,
  // the three bars as the brand mark, and a black end block with Co Print. A black chassis line ties them underneath.
  beam(g, W, H, c) {
    const base = 6.5;                                                   // the black chassis line along the bottom
    blade(g, 96, 214, 0, H, INK);                                       // heavy black start
    const up = RAKE * (base + GAP);                                     // canvas y runs down: the chassis line is at the bottom
    blade(g, 214 + GAP + up, 476 + up, 0, H - base - GAP, c);           // colour blade, sitting on the chassis line
    blade(g, 214 + GAP, 476, H - base, H, INK);                         // chassis line under it
    text(g, "QUADRO", 236, H - base - 4.2, 23.5, INK, 900, true, 1.4);
    let x = 476 + up + GAP + 2;                                              // the brand mark: three bars, black, full height
    for (const w of [8, 5, 2.6]) { blade(g, x, x + w, 0, H, INK); x += w + 3; }
    blade(g, x + 3, 650, 0, H, INK);                                    // black end block
    logo(g, x + 22, 5.2, 12.5, "white");
    text(g, "4 INDEPENDENT TOOLHEADS", x + 22, H - 5, 5.2, TECH, 600, false, 1.3);   // secondary: grey on black
    text(g, "SPECIAL SERIES", 120, H - 5, 5.2, TECH, 600, false, 1.6);
  },
  // Z tower front strip: 22.6 x 383, y up from the base (12 mm above the deck). Mirrored on the second tower.
  // A heavy black foot and a colour blade above it; the two feet differ by 18 mm, the blades are equal.
  tower(g, W, H, c, i) {
    const foot = H - (i ? 118 : 136);
    below(g, W, H, foot, INK);
    band(g, W, foot - GAP, 104, c);
    band(g, W, foot - GAP - 104 - 4, 3, INK);                           // a short black cap line closes the blade
  },
  // Z tower inner side face, the solid strip behind the slot the Z carriage runs in: 7 x 383. The carriage never
  // comes behind z 273; this strip is z 277.5..284.5. The black foot, then one colour line ending in a raked tip.
  towerSide(g, W, H, c, i) {
    const foot = H - (i ? 118 : 136);
    below(g, W, H, foot, INK);
    g.fillStyle = c; g.beginPath(); g.moveTo(1.5, foot - GAP - SLOPE * 1.5); g.lineTo(4.5, foot - GAP - SLOPE * 4.5); g.lineTo(4.5, 70); g.lineTo(1.5, 75); g.closePath(); g.fill();
  },
  // toolhead front cover: 34.9 x 62, between the printed "Tool n" label below and the LED window above. The same on
  // all four: a colour wedge with a silver line above it, and a small colour shard answering it at the top corner.
  head(g, W, H, c) {
    below(g, W, H, H - 14, c);                                          // colour wedge rising to the right
    band(g, W, H - 14 - GAP, 2.2, SILVER);                              // brushed-silver line
    band(g, W, H - 14 - GAP - 2.2 - GAP, 7, INK);                       // black band, darker than the cover
    g.fillStyle = c; g.beginPath(); g.moveTo(-1, 9); g.lineTo(-1, -1); g.lineTo(13, -1); g.closePath(); g.fill();   // top shard
  },
  // Qdock end cover, outer face of its box: 81 x 36 on black plastic. The brand mark in colour, then Q-DOCK.
  dock(g, W, H, c) {
    blade(g, -12, 18, 0, H, c);
    let x = 18 + GAP + 1;
    for (const w of [5, 3.2, 1.8]) { blade(g, x, x + w, 0, H, c); x += w + 2.2; }
    text(g, "Q-DOCK", 45, H / 2 + 4, 10.5, WHITE, 800, true, 1);
  },
  // base front, the flat tilted centre panel between the factory-printed Co Print and QUADRO: 100 x 9, low and plain
  baseStrip(g, W, H, c) {
    blade(g, 0, W - RAKE * H, 0, H, INK);
    blade(g, W * 0.56, W - RAKE * H - 2.5, 2, H - 2, c);
  },
};

// where each sticker goes: the part, then each face as origin (world mm), right and up directions, normal, size (mm).
// Faces and their flat extents were measured from the CAD mesh; every rectangle stays 2 mm or more inside its face.
const PLACES = [
  { part: /x-alu-profile-1-16-06$/, faces: () => [{ art: "beam", o: [388.5, 82.2, 195.0], u: [-1, 0, 0], v: [0, 1, 0], n: [0, 0, -1], w: 720, h: 31 }] },
  { part: /z-alu-profile-3-1$/, faces: () => [
    { art: "tower", i: 0, o: [-141.6, 12, 249.45], u: [-1, 0, 0], v: [0, 1, 0], n: [0, 0, -1], w: 22.6, h: 383 },
    { art: "towerSide", i: 0, o: [-136.2, 12, 284.5], u: [0, 0, -1], v: [0, 1, 0], n: [1, 0, 0], w: 7, h: 383 }] },
  { part: /z-alu-profile-3-2$/, faces: () => [
    { art: "tower", i: 1, o: [220.9, 12, 249.6], u: [-1, 0, 0], v: [0, 1, 0], n: [0, 0, -1], w: 22.6, h: 383, mirror: true },
    { art: "towerSide", i: 1, o: [193.2, 12, 277.5], u: [0, 0, 1], v: [0, 1, 0], n: [-1, 0, 0], w: 7, h: 383 }] },
  { part: /x-inject-plastic-8$/, faces: (b, k) => [{ art: "head", i: k, o: [b.max.x - 10.1, b.min.y + 25, b.min.z], u: [-1, 0, 0], v: [0, 1, 0], n: [0, 0, -1], w: 34.9, h: 62 }] },
  { part: /y-inject-plastic-2-revised/, optional: true, faces: () => [{ art: "baseStrip", o: [88, -43.6 + 4 * 0.9682, -70.8 + 4 * 0.2504], u: [-1, 0, 0], v: [0, 0.9682, 0.2504], n: [0, 0.2504, -0.9682], w: 100, h: 9 }] },
  { part: /x-inject-plastic-6$/, faces: () => [{ art: "dock", i: 1, o: [-355.5, 80, 202], u: [0, 0, 1], v: [0, 1, 0], n: [-1, 0, 0], w: 81, h: 36 }] },
  { part: /x-inject-plastic-2$/, faces: () => [{ art: "dock", i: 0, o: [412.5, 80, 283], u: [0, 0, -1], v: [0, 1, 0], n: [1, 0, 0], w: 81, h: 36 }] },
];

// ---------- scene ----------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#e6e7e9");
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(-1, 2, -1.6); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 0.5));
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 20);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
function resize() { const { width, height } = stage.getBoundingClientRect(); renderer.setSize(width, height, false); camera.aspect = width / height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

// the printer's own materials
const MAT = {
  head: new THREE.MeshStandardMaterial({ color: 0x25282c, roughness: 0.55, metalness: 0.1 }),
  dock: new THREE.MeshStandardMaterial({ color: 0x1d1f22, roughness: 0.5, metalness: 0.2 }),
  alu: new THREE.MeshStandardMaterial({ color: 0xdfe2e5, roughness: 0.32, metalness: 0.5 }),
  rail: new THREE.MeshStandardMaterial({ color: 0x8e949a, roughness: 0.28, metalness: 0.9 }),
  motor: new THREE.MeshStandardMaterial({ color: 0x3a3d42, roughness: 0.45, metalness: 0.5 }),
  shell: new THREE.MeshStandardMaterial({ color: 0xe8e9eb, roughness: 0.6, metalness: 0 }),
  pei: new THREE.MeshStandardMaterial({ color: 0xc9a85a, roughness: 0.8, metalness: 0.3 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x303236, roughness: 0.6, metalness: 0.2 }),
  other: new THREE.MeshStandardMaterial({ color: 0xa3a7ac, roughness: 0.45, metalness: 0.4 }),
};
function baseMaterial(p) {
  if (p.includes("toolhead")) return MAT.head;
  if (p.includes("pei sheet") && !p.includes("magnet")) return MAT.pei;
  if (p.includes("yan-kapak")) return MAT.dock;
  if (p.includes("mgn")) return MAT.rail;
  if (/nema|17hs|ldo|motor/.test(p)) return MAT.motor;
  if (/alu-profile|alu-ext|z-axis-alu|x-alu|y-alu/.test(p)) return MAT.alu;
  if (/inject|kapak|cover|kasa|filament|heated|move face|fillet|lcd/.test(p)) return MAT.shell;
  if (/screw|vida/.test(p)) return MAT.dark;
  return MAT.other;
}
// A material that shows up to two stickers: each a texture laid on one plane, inside its rectangle only, with a satin
// vinyl finish; everywhere else the part's own material.
function stickerMaterial(base, faces) {
  const m = base.clone(); m.userData.faces = faces;
  m.onBeforeCompile = (sh) => {
    faces.forEach((f, k) => {
      sh.uniforms["uTex" + k] = { value: f.tex }; sh.uniforms["uO" + k] = { value: new THREE.Vector3(...f.o) };
      sh.uniforms["uU" + k] = { value: new THREE.Vector3(...f.u) }; sh.uniforms["uV" + k] = { value: new THREE.Vector3(...f.v) };
      sh.uniforms["uN" + k] = { value: new THREE.Vector3(...f.n) }; sh.uniforms["uS" + k] = { value: new THREE.Vector2(f.w, f.h) };
    });
    const decl = faces.map((_, k) => `uniform sampler2D uTex${k}; uniform vec3 uO${k}, uU${k}, uV${k}, uN${k}; uniform vec2 uS${k};`).join("\n");
    const apply = faces.map((_, k) => `{ vec3 d = vWP - uO${k};
        if (dot(normalize(vWN), uN${k}) > 0.9 && abs(dot(d, uN${k})) < 1.2) {
          vec2 st = vec2(dot(d, uU${k}), dot(d, uV${k})) / uS${k};
          if (st.x >= 0.0 && st.x <= 1.0 && st.y >= 0.0 && st.y <= 1.0) { vec4 t = texture2D(uTex${k}, st); diffuseColor.rgb = mix(diffuseColor.rgb, t.rgb, t.a); vinyl = max(vinyl, t.a); }
        } }`).join("\n");
    sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vWP; varying vec3 vWN;")
      .replace("#include <project_vertex>", "#include <project_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz * 1000.0; vWN = normalize(mat3(modelMatrix) * objectNormal);");
    sh.fragmentShader = sh.fragmentShader.replace("#include <common>", "#include <common>\nvarying vec3 vWP; varying vec3 vWN; float vinyl = 0.0;\n" + decl)
      .replace("#include <color_fragment>", "#include <color_fragment>\n" + apply)
      .replace("#include <roughnessmap_fragment>", "#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, 0.42, vinyl);")
      .replace("#include <metalnessmap_fragment>", "#include <metalnessmap_fragment>\nmetalnessFactor = mix(metalnessFactor, 0.0, vinyl);");
  };
  m.customProgramCacheKey = () => "stk" + faces.length;
  return m;
}
// draw one sticker's artwork into a texture (transparent outside the graphics)
function artTexture(f, color) {
  const cv = document.createElement("canvas"); cv.width = Math.round(f.w * PX); cv.height = Math.round(f.h * PX);
  const g = cv.getContext("2d"); g.scale(PX, PX);
  if (f.mirror) { g.translate(f.w, 0); g.scale(-1, 1); }
  g.save(); g.beginPath(); g.rect(0, 0, f.w, f.h); g.clip();
  ART[f.art](g, f.w, f.h, color, f.i || 0);
  g.restore();
  const tex = f.tex || new THREE.CanvasTexture(cv); tex.image = cv; tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; tex.needsUpdate = true;
  tex.flipY = true; return tex;
}
const stickerFaces = [];
let center = new THREE.Vector3(), radius = 1;
async function start() {
  await Promise.all([loadLogo(), ...["italic 900 20px 'Barlow Condensed'", "italic 800 20px 'Barlow Condensed'", "600 20px 'Barlow Condensed'"].map((f) => document.fonts.load(f))]);
  const gltf = await new GLTFLoader().loadAsync("../quadro.glb");
  const root = gltf.scene; scene.add(root); root.updateMatrixWorld(true);
  const counters = {};
  root.traverse((o) => {
    if (!o.isMesh) return;
    const at = gltf.parser.associations.get(o);
    const raw = at && at.nodes !== undefined ? gltf.parser.json.nodes[at.nodes].name || "" : "";
    let path = ""; for (let n = o; n; n = n.parent) path += " " + n.name;
    const base = baseMaterial(path.toLowerCase().replace(/_/g, " "));
    const part = raw.split(":").pop();
    const place = PLACES.find((p) => p.part.test(part) && (!p.optional || new URLSearchParams(location.search).get("base") === "1"));
    if (!place) { o.material = base; return; }
    const k = (counters[part] = (counters[part] ?? -1) + 1);
    const b = new THREE.Box3().setFromObject(o); b.min.multiplyScalar(1000); b.max.multiplyScalar(1000);
    const faces = place.faces(b, k);
    o.material = stickerMaterial(base, faces); stickerFaces.push(...faces);
  });
  // the four heads, left to right from the front, get T1..T4
  const heads = stickerFaces.filter((f) => f.art === "head").sort((a, b) => b.o[0] - a.o[0]);
  heads.forEach((f, k) => (f.i = k));
  const box = new THREE.Box3().setFromObject(root); box.getCenter(center); radius = box.getSize(new THREE.Vector3()).length() / 2;
  const q = new URLSearchParams(location.search);
  setTheme(q.get("theme") || "red"); setView(q.get("view") || "iso");
  window.__ready = true;
}
function setTheme(k) {
  for (const f of stickerFaces) f.tex = artTexture(f, THEMES[k]);
  scene.traverse((o) => { if (o.isMesh && o.material.userData.faces) o.material.needsUpdate = true; });
}
const VIEWS = { iso: [214, 18, 1.0], front: [180, 4, 0.95], side: [256, 10, 1.0], right: [112, 14, 1.0],
  beam: [188, 6, 0.42, [0.03, 0.1, 0.2]], inner: [300, 6, 0.42, [-0.12, 0.15, 0.27]], base: [182, 14, 0.4, [-0.02, -0.03, -0.06]], head: [196, 4, 0.3, [0.32, 0.12, 0.17]], dock: [118, 8, 0.36, [0.4, 0.08, 0.21]], tower: [218, 10, 0.62, [-0.15, 0.2, 0.27]] };
function setView(k) {
  const [az, el, f, off] = VIEWS[k], a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el), d = radius * 2.4 * f;
  const target = off ? new THREE.Vector3(...off) : center.clone();
  camera.position.copy(target).add(new THREE.Vector3(Math.sin(a) * Math.cos(e) * d, Math.sin(e) * d, Math.cos(a) * Math.cos(e) * d));
  controls.target.copy(target); controls.update();
}
window.__set = (theme, view) => { setTheme(theme); setView(view); };
// the flat artwork of every sticker, for the review sheet
window.__sheet = (theme) => {   // one of each artwork, flat, as PNG data URLs
  const seen = new Set(), out = [];
  for (const f of stickerFaces) { const key = f.art + (f.art === "head" ? 0 : f.i ?? ""); if (seen.has(key)) continue; seen.add(key); out.push({ art: f.art, i: f.i || 0, w: f.w, h: f.h, url: artTexture({ ...f, tex: null }, THEMES[theme]).image.toDataURL() }); }
  return out;
};
const ui = document.getElementById("ui");
for (const k of Object.keys(THEMES)) { const b = document.createElement("button"); b.textContent = k; b.onclick = () => setTheme(k); ui.append(b); }
for (const k of Object.keys(VIEWS)) { const b = document.createElement("button"); b.textContent = k; b.onclick = () => setView(k); ui.append(b); }
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
start();
</script>
</body></html>
